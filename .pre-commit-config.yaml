repos:
  # --- Backend: Python ---
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^backend/
        language_version: python3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/

  # --- Frontend: Vue/TypeScript ---
  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        entry: npx --prefix frontend prettier --write
        language: system
        files: ^frontend/src/.*\.(ts|vue|js)$
      - id: backend-tests
        name: backend tests
        entry: python -m pytest backend/tests
        language: system
        pass_filenames: false
        files: ^backend/(app|tests)/.*\.py$
      - id: frontend-tests
        name: frontend tests
        entry: npm --prefix frontend run test:run
        language: system
        pass_filenames: false
        files: ^frontend/(src|tests)/.*\.(ts|vue|js)$
